# Every PR (and every push to main) must pass these before it can merge - make them
# required checks in the main branch's protection rule (docs/RELEASING.md).
# The Release workflow runs the same jobs again on the tagged commit (workflow_call).
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  app:
    name: Unit tests + debug build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - name: NDK + CMake (app/build.gradle.kts pins them)
        run: sdkmanager --install "ndk;28.2.13676358" "cmake;3.22.1" "platforms;android-34"

      - uses: gradle/actions/setup-gradle@v4

      - name: Translations
        run: python3 scripts/check_translations.py

      # ROM-backed tests skip here (no ROMs in CI - they run on the release runner);
      # fixtures, guards, Paparazzi renders and everything else run.
      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Debug APK (Kotlin + the native mGBA / rcheevos build)
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: app/build/reports/tests/
          retention-days: 7

  ui-preview:
    name: UI preview + stress
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      # Compiles the real UI sources against desktop Compose and renders every screen.
      - name: Render every screen
        run: ./gradlew -p ui-preview render --stacktrace

      # Rapid tab switching against memory / time budgets (ui-preview/src/render/Stress.kt).
      - name: Stress
        run: ./gradlew -p ui-preview stress --stacktrace

      - name: Screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-preview-shots
          path: ui-preview/build/shots/
          retention-days: 7
