# Builds website/ and deploys it to Firebase Hosting (project pokedaisy). The live site only changes with
# an app release: a published release (not a pre-release) deploys that release's tag, so the game table and
# ROM check never get ahead of the APK people can download. Pushes to main only build and test; pull
# requests from this repo get a temporary preview channel (linked in a PR comment). Run it by hand with a
# release tag to redeploy (or roll back to) that release's site.
name: Website

on:
  push:
    branches: [main]
    paths: ['website/**', '.github/workflows/website.yml']
  pull_request:
    paths: ['website/**', '.github/workflows/website.yml']
  # "released": published as a full release, or a pre-release promoted to one. The home and releases
  # pages list GitHub releases, read at build time.
  release:
    types: [released]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag whose website goes live (e.g. v1.1.4)
        required: true

permissions:
  contents: read
  checks: write
  pull-requests: write

# Actions are pinned to commits, not tags: a moved tag can't run new code with the Firebase secret.
# Bump them by hand (the comment names the release).
concurrency:
  group: website-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          # A release builds its own tag (the default ref); a manual run, the tag it was given.
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || '' }}
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: website/.nvmrc
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Live: releases and manual runs only. Previews: pull requests from this repo (forks get no secrets).
      # A push to main stops here, built and tested.
      - if: >-
          github.event_name == 'release' || github.event_name == 'workflow_dispatch' ||
          (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
        uses: FirebaseExtended/action-hosting-deploy@500ac625ca2dd40cbd15f7659af953801858032a # v0.11.0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_POKEDAISY }}
          projectId: pokedaisy
          entryPoint: website
          channelId: ${{ github.event_name == 'pull_request' && '' || 'live' }}
          # The action installs firebase-tools when it runs: an exact version, not "latest", while the secret is in scope.
          firebaseToolsVersion: 15.31.0
