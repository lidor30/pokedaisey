# Shared ROM registry for scripts/smoke_test.sh and scripts/capture_fixture.sh.
# One game per line: key|label|device path under files/roms/
#
# `key` also names the fixture directory under app/src/test/resources/fixtures/.
# `device path` is the absolute path inside the app's private external storage
# on the connected device (Android/data/com.pokedaisy.app/files/roms/) -
# see each script's own comment for how it's used.
#
# Add a new hack here once it's actually wired up (NativeConfig/GameKind/
# detection landed and manually verified) - not before, so a still-unsupported
# ROM doesn't show up as a confusing smoke-test failure.
firered_qol|FireRed QoL (v4 struct)|/storage/emulated/0/Android/data/com.pokedaisy.app/files/roms/firered-qol.gba
emerald_qol|Emerald QoL (v4 struct)|/storage/emulated/0/Android/data/com.pokedaisy.app/files/roms/emerald-qol.gba
